name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  test-and-assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
      - name: Install pinned native toolchain
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Unit tests and release packaging
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Verify 16 KB native and APK alignment
        run: |
          ./scripts/test-verify-16k-alignment.sh
          ./scripts/verify-16k-alignment.sh app/build/outputs/apk/release/app-release-unsigned.apk
